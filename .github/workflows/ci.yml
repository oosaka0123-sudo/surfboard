name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SITE_URL: https://surfboard.rss7.net

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Validate production-shaped output
        run: |
          test -f dist/index.html
          test -f dist/diagnosis/index.html
          test -f dist/boards/index.html
          test -f dist/method/index.html
          test -f dist/privacy/index.html
          test -f dist/advertising-policy/index.html
          test -f dist/media/hero-surf.mp4
          grep -q 'surfboard.rss7.net' dist/sitemap-*.xml
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/media/hero-surf.mp4')
          data = p.read_bytes()
          assert len(data) > 4096, 'Hero video is unexpectedly small'
          assert data[4:8] == b'ftyp', 'Hero video is not an MP4 container'
          assert b'moov' in data, 'Hero video is missing moov metadata'
          assert b'mdat' in data, 'Hero video is missing media data'
          print(f'Hero MP4 validation OK: {len(data)} bytes')
          PY
