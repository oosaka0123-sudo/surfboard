name: Visual Mobile QA

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: https://surfboard.rss7.net

jobs:
  mobile-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Build production-shaped site
        run: npm run build

      - name: Install Playwright for QA only
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve static build
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/surfboard-http.log 2>&1 &
          echo $! > /tmp/surfboard-http.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/surfboard-http.log
          exit 1

      - name: Run mobile browser QA
        run: node .github/scripts/visual-qa.mjs

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surfboard-mobile-qa
          path: visual-qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
